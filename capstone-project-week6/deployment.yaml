apiVersion: apps/v1
kind: Deployment
metadata:
  name: afyaplus-platform-deployment
  labels:
    app: afyaplus-platform
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: afyaplus-platform
  template:
    metadata:
      labels:
        app: afyaplus-platform
    spec:
      containers:
      - name: afyaplus-platform
        image: afyaplus-platform:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - secretRef:
            name: afyaplus-secrets
        - configMapRef:
            name: afyaplus-config
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: afyaplus-platform-service
spec:
  type: ClusterIP
  selector:
    app: afyaplus-platform
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: afyaplus-platform-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: afyaplus-platform-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

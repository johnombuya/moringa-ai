version: "3.8"

services:
  afyaplus-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: afyaplus-platform:1.0.0
    container_name: afyaplus-platform
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
